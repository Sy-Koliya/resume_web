<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Application received - Bite Hunt</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/site.css">
</head>
<body class="success-page">
  <div class="top-stripe" aria-hidden="true"></div>
  <main class="success-shell">
    <a class="brand" href="/"><span class="brand-mark">B</span><span>Bite Hunt</span></a>
    <section class="success-card">
      <p class="section-label">Application received</p>
      <h1>Thanks for putting your name in the hunt.</h1>
      <p>Your resume has been stored successfully. If your background matches what the team needs, Bite Hunt will contact you by email.</p>
      <div class="reference-box">
        <span>Your reference</span>
        <strong>{{ reference }}</strong>
      </div>
      <a class="button button-primary" href="/">Back to careers</a>
    </section>
  </main>
</body>
</html>
